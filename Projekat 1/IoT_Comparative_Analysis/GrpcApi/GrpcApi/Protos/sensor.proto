syntax = "proto3";

option csharp_namespace = "GrpcApi";

import "google/protobuf/timestamp.proto";

service SensorService {
  // Scenario A: High-Frequency Ingestion
  rpc IngestReading (ReadingRequest) returns (IngestResponse);
  
  // Scenario C: Heavy Querying
  rpc GetAggregatedData (AggregatedRequest) returns (AggregatedResponse);
}

message ReadingRequest {
  string device_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  double temperature = 3;
  double humidity = 4;
  int32 co2_level = 5;
  double voltage = 6;
  double gps_lat = 7;
  double gps_lng = 8;
}

message IngestResponse {
  bool success = 1;
  string message = 2;
}

message AggregatedRequest {
  string device_id = 1;
  int32 days = 2;
}

message AggregatedResponse {
  double avg_temperature = 1;
  int32 max_co2 = 2;
  double min_voltage = 3;
}