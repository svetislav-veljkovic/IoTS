x-common-env: &common-env
  BROKER_TYPE: ${BROKER_TYPE:-mqtt}
  POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING:-Host=iot-postgres;Port=5432;Database=iot_data;Username=iotuser;Password=iotpassword}
  MQTT_HOST: ${MQTT_HOST:-iot-mosquitto}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_TOPIC: ${MQTT_TOPIC:-iot/sensors}
  MQTT_QOS: ${MQTT_QOS:-1}
  MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-analytics-svc}
  MQTT_CLEAN_SESSION: ${MQTT_CLEAN_SESSION:-false}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-iot-kafka:9092}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-iot-sensors}
  KAFKA_ACKS: ${KAFKA_ACKS:-1}
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-iot-consumers}
  DEVICE_COUNT: ${DEVICE_COUNT:-100}
  MESSAGES_PER_SECOND: ${MESSAGES_PER_SECOND:-10}
  SIMULATION_DURATION_SECONDS: ${SIMULATION_DURATION_SECONDS:-60}
  DATASET_PATH: ${DATASET_PATH:-/app/data/data_set.csv}
  SIMULATION_MODE: ${SIMULATION_MODE:-normal}
  BURST_RATE: ${BURST_RATE:-5.0}
  BURST_DURATION: ${BURST_DURATION:-15}
  CRITICAL_RATIO: ${CRITICAL_RATIO:-0.05}
  STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
  BATCH_SIZE: ${BATCH_SIZE:-500}
  TUMBLING_WINDOW_SECONDS: ${TUMBLING_WINDOW_SECONDS:-10}
  TEMPERATURE_ALERT_THRESHOLD: ${TEMPERATURE_ALERT_THRESHOLD:-50.0}

networks:
  iot-network:
    driver: bridge
    name: iot-network

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
  kafka-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    restart: unless-stopped
    networks: [iot-network]
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_data}
      POSTGRES_USER: ${POSTGRES_USER:-iotuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotpassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iotuser} -d ${POSTGRES_DB:-iot_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: iot-mosquitto
    restart: unless-stopped
    networks: [iot-network]
    ports: ["1883:1883", "9001:9001"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t __hc -m p -q 0 -i hc 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:3.7.0
    container_name: iot-kafka
    restart: unless-stopped
    networks: [iot-network]
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@iot-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://iot-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  ingestion:
    build: ./services/ingestion
    container_name: iot-ingestion
    restart: unless-stopped
    environment: { <<: *common-env }
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mosquitto: { condition: service_healthy }
      kafka:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
    networks: [iot-network]

  storage:
    build: ./services/storage/StorageService
    container_name: iot-storage
    restart: unless-stopped
    environment: { <<: *common-env }
    depends_on:
      mosquitto: { condition: service_healthy }
      kafka:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
    networks: [iot-network]

  analytics:
    build: ./services/analytics/AnalyticsService
    container_name: iot-analytics
    restart: unless-stopped
    environment: { <<: *common-env }
    depends_on:
      mosquitto: { condition: service_healthy }
      kafka:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
    networks: [iot-network]
